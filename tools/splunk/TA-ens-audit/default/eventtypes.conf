[ens_audit]
search = sourcetype=ens:audit
description = Every ENS audit event

[ens_audit_authentication]
search = sourcetype=ens:audit category=authentication ens_action=auth.login
description = ENS sign-ins, successful and failed

[ens_audit_access_denied]
search = sourcetype=ens:audit category=authorization
description = Requests an ENS application refused

[ens_audit_change]
search = sourcetype=ens:audit (category=account OR category=configuration OR category=license OR category=data) outcome=success NOT ens_action=data.exported
description = Changes made through an ENS application

[ens_audit_integrity]
search = sourcetype=ens:audit (ens_action=audit.verified OR ens_action=audit.delivery-failed OR ens_action=audit.delivery-recovered OR ens_action=audit.pruned)
description = The audit trail itself: verification, delivery problems, pruning
