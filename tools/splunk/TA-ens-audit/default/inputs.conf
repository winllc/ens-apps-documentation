# Pull events from an application's /api/audit/events API (one stanza per
# application). Copy a stanza to local/inputs.conf, set the URL, token file
# and index, and enable it. The token file holds the API token an
# administrator created on the application's audit page; keep it readable
# only by the Splunk user. The checkpoint lives in $SPLUNK_HOME/var/lib/splunk/modinputs.
[script://$SPLUNK_HOME/etc/apps/TA-ens-audit/bin/ens_audit_pull.py https://certalert.example.com $SPLUNK_HOME/etc/apps/TA-ens-audit/local/certalert.token]
disabled = true
interval = 60
sourcetype = ens:audit
source = ens_audit_pull:certalert
index = main
