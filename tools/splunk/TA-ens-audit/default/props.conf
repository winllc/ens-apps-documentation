# ENS application audit events, ens-audit/1: one JSON object per event.
# Sent by HEC (/services/collector/event), read from an application's audit
# file or container log, or pulled from its /api/audit/events API.
[ens:audit]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 100000
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
KV_MODE = json
category = Application
description = ENS application audit event (ens-audit/1)

# The event's own "action" (auth.login, settings.changed, ...) is kept as
# ens_action, because the CIM uses "action" for the outcome.
FIELDALIAS-ens_action = action AS ens_action
FIELDALIAS-cim_user = actor.id AS user
FIELDALIAS-cim_src = source.ip AS src
FIELDALIAS-cim_http_user_agent = source.userAgent AS http_user_agent
FIELDALIAS-cim_object_id = target.id AS object_id
FIELDALIAS-cim_object = target.name AS object
FIELDALIAS-cim_object_category = target.type AS object_category
FIELDALIAS-cim_app = product AS app
FIELDALIAS-cim_signature = action AS signature
FIELDALIAS-cim_dest = host AS dest
FIELDALIAS-cim_session_id = session AS session_id
EVAL-vendor = "ENS Solutions"
EVAL-vendor_product = "ENS " . product
EVAL-status = if(outcome == "success", "success", "failure")
EVAL-change_type = category
EVAL-authentication_method = 'details.method'
EVAL-action = case(category == "authentication" OR category == "authorization", if(outcome == "success", "success", "failure"), match(ens_action, "\.(created|issued|installed|granted|added|uploaded|imported)$"), "created", match(ens_action, "\.(deleted|revoked|removed|pruned)$"), "deleted", true(), "modified")
EVAL-severity_id = case(severity == "alert", 1, severity == "warning", 4, severity == "notice", 5, true(), 6)

# Syslog, straight into a Splunk TCP or UDP input (sourcetype ens:audit:syslog).
# Prefer HEC, or Splunk Connect for Syslog / rsyslog in front of Splunk. Over
# TCP the applications use octet-counting framing (RFC 6587): split on the
# "<length> <PRI>1 <date>" that starts each message.
[ens:audit:syslog]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]*\d+ |[\r\n]+)(?=<\d{1,3}>1 \d{4}-\d\d-\d\dT)
TRUNCATE = 100000
# Keep only the JSON event: drop the frame length and the RFC 5424 header.
SEDCMD-strip_syslog_header = s/^[^{]*//
TIME_PREFIX = "time":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 32
rename = ens:audit
